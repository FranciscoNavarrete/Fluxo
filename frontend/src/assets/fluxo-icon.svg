  <polyline points="29,11 32,15 28,17" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom arc arrow (← clockwise) -->
  <path d="M 36 23 A 12 12 0 0 1 16 33" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polyline points="19,37 16,33 20,31" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
